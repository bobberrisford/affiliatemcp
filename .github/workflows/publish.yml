name: Publish

on:
  push:
    branches: [main]
  # Manual re-run path: the publish job is idempotent (it skips when the
  # version is already on npm), so a maintainer can safely re-trigger a
  # publish that was cancelled or lost to a runner outage without needing
  # a new push to main.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release + tag
  id-token: write # required for npm OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      # Consumed by the registry job below, so the listing is only republished
      # on a release that actually reached npm.
      published: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      # OIDC trusted publishing requires npm >= 11.5.1; Node 20 ships npm 10.x.
      # Pinned to major 11: npm 12 requires Node >= 22, so `npm@latest` broke
      # every publish run on this Node 20 workflow when npm 12 shipped.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Decide whether this version needs publishing
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "affiliate-networks-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$VERSION is not on npm; will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.check.outputs.publish == 'true'
        run: npm run lint
      - if: steps.check.outputs.publish == 'true'
        run: npm test
      - if: steps.check.outputs.publish == 'true'
        run: npm run build
      - if: steps.check.outputs.publish == 'true'
        run: npm run build:mcpb
      - if: steps.check.outputs.publish == 'true'
        run: npm publish
      - name: Ensure a GitHub release exists for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do."
          else
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi
      - name: Attach the Claude Desktop MCP Bundle
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Versioned asset: archival, and lets anyone pin a specific release.
          gh release upload "v$VERSION" ".artifacts/affiliate-networks-mcp-$VERSION.mcpb" --clobber
          # Stable-named copy: the marketing site links to
          # releases/latest/download/affiliate-networks-mcp.mcpb, which always
          # resolves to the newest release, so the download link never goes stale.
          cp ".artifacts/affiliate-networks-mcp-$VERSION.mcpb" ".artifacts/affiliate-networks-mcp.mcpb"
          gh release upload "v$VERSION" ".artifacts/affiliate-networks-mcp.mcpb" --clobber

  # The MCP Registry listing. RELEASING.md carried this as a manual post-release
  # step and noted that skipping it "leaves the registry advertising the
  # previous version" — a silent failure, and manual release steps get skipped.
  #
  # Separate job, not extra steps on `publish`, for one reason: the signing key
  # lives in a protected Environment restricted to main, and `environment` can
  # only be set per job. Keeping it off the npm job means the key is not present
  # in the job that runs the build and the package's own scripts.
  #
  # No version-sync step is needed here. tests/shared/telemetry.test.ts pins
  # both server.json version fields to package.json, so a stale listing version
  # fails CI long before it can reach the registry.
  registry:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Authenticate to the MCP Registry
        # DNS-verified namespace. The listing name is
        # ai.agenticaffiliate/affiliate-networks-mcp and npm's mcpName is pinned
        # to it, so github-oidc auth is not an option: it would only grant
        # io.github.bobberrisford/*. See docs/product/distribution-listings-plan.md.
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          ./mcp-publisher login dns \
            --domain agenticaffiliate.ai \
            --algorithm ed25519 \
            --private-key "$MCP_REGISTRY_KEY"
      - name: Publish the listing
        run: ./mcp-publisher publish
      - name: Verify the registry serves this version
        # The registry accepts a publish and then validates it against the live
        # npm package, so a bad listing surfaces here rather than at the next
        # release.
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          LIVE="$(curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers/ai.agenticaffiliate%2Faffiliate-networks-mcp/versions/latest" | jq -r .server.version)"
          echo "registry=$LIVE package=$VERSION"
          if [ "$LIVE" != "$VERSION" ]; then
            echo "::error::registry is serving $LIVE, expected $VERSION"
            exit 1
          fi
